<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rak — Baca Komik</title>
<style>
  :root{
    --ink:#0c1220;
    --panel:#141d33;
    --panel-2:#1b2744;
    --line:#2a3860;
    --spine:#e8542f;
    --paper:#f2ecdd;
    --paper-dim:#b9b3a0;
    --gold:#e8b23e;
    --font-display:'Georgia', 'Iowan Old Style', serif;
    --font-body:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'SFMono-Regular', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-body);
    min-height:100vh;
  }
  ::selection{background:var(--spine);color:var(--paper);}

  header{
    position:sticky;top:0;z-index:40;
    background:rgba(12,18,32,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:14px 16px;
  }
  .header-row{ display:flex;align-items:center;gap:12px;max-width:960px;margin:0 auto; }
  .brand{ display:flex;align-items:baseline;gap:2px;cursor:pointer;flex-shrink:0; }
  .brand b{ font-family:var(--font-display);font-size:22px;letter-spacing:-0.5px;color:var(--paper); }
  .brand span{ font-family:var(--font-mono);font-size:11px;color:var(--spine);letter-spacing:1px; }
  .search-wrap{flex:1;position:relative;}
  .search-wrap input{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--paper);
    padding:10px 14px 10px 34px;border-radius:8px;font-size:14px;font-family:var(--font-body);
  }
  .search-wrap input:focus{outline:2px solid var(--spine);outline-offset:1px;border-color:transparent;}
  .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:0.5;}

  nav.tabs{
    max-width:960px;margin:12px auto 0;display:flex;gap:6px;overflow-x:auto;
    scrollbar-width:none;padding-bottom:2px;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex-shrink:0;background:transparent;border:1px solid var(--line);color:var(--paper-dim);
    padding:7px 14px;border-radius:999px;font-size:13px;font-family:var(--font-body);cursor:pointer;
    transition:all .15s;
  }
  nav.tabs button.active{background:var(--spine);border-color:var(--spine);color:var(--paper);font-weight:600;}
  nav.tabs button:hover:not(.active){border-color:var(--gold);color:var(--paper);}

  main{max-width:960px;margin:0 auto;padding:20px 16px 60px;}

  .section-title{
    font-family:var(--font-display);font-size:20px;margin:6px 0 16px;
    display:flex;align-items:center;gap:10px;color:var(--paper);
  }
  .section-title::before{ content:'';width:4px;height:20px;background:var(--spine);display:inline-block;border-radius:2px; }

  .genre-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
  .genre-chip{
    background:var(--panel);border:1px solid var(--line);color:var(--paper-dim);
    padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:var(--font-mono);
  }
  .genre-chip:hover{border-color:var(--gold);color:var(--gold);}
  .genre-chip.active{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700;}

  .grid{ display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px 12px; }
  .card{ cursor:pointer;position:relative; }
  .card .cover{
    aspect-ratio:2/3;background:var(--panel-2) linear-gradient(160deg,var(--panel-2),var(--panel));
    border-radius:6px;overflow:hidden;position:relative;border:1px solid var(--line);
    box-shadow:3px 3px 0 rgba(0,0,0,.35);
    transition:transform .15s;
  }
  .card:hover .cover{transform:translateY(-3px);}
  .card .cover img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .cover .ph{
    display:flex;align-items:center;justify-content:center;height:100%;color:var(--paper-dim);
    font-family:var(--font-display);font-size:12px;text-align:center;padding:8px;
  }
  .type-tag{
    position:absolute;top:6px;left:6px;background:rgba(12,18,32,0.85);color:var(--gold);
    font-family:var(--font-mono);font-size:9px;letter-spacing:0.5px;padding:2px 6px;border-radius:4px;
    text-transform:uppercase;
  }
  .rating-tag{
    position:absolute;top:6px;right:6px;background:rgba(12,18,32,0.85);color:#ffd166;
    font-family:var(--font-mono);font-size:9px;padding:2px 6px;border-radius:4px;
  }
  .card .title{
    font-size:12.5px;margin-top:7px;line-height:1.3;color:var(--paper);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .chapter{font-family:var(--font-mono);font-size:10.5px;color:var(--spine);margin-top:3px;}

  .empty,.loading,.error{ text-align:center;padding:50px 20px;color:var(--paper-dim);font-family:var(--font-mono);font-size:13px; }
  .error{color:#ff8a70;}
  .spine-loader{
    display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--spine);
    border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .overlay{ position:fixed;inset:0;background:var(--ink);z-index:100;overflow-y:auto; display:none; }
  .overlay.open{display:block;}
  .overlay-bar{
    position:sticky;top:0;background:rgba(12,18,32,0.95);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:5;
  }
  .back-btn{
    background:var(--panel);border:1px solid var(--line);color:var(--paper);width:34px;height:34px;
    border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .back-btn:hover{border-color:var(--spine);}
  .overlay-bar .ttl{font-family:var(--font-display);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .detail-hero{ display:flex;gap:16px;padding:20px 16px;max-width:760px;margin:0 auto; }
  .detail-cover{
    width:120px;flex-shrink:0;aspect-ratio:2/3;border-radius:8px;overflow:hidden;
    border:1px solid var(--line);box-shadow:4px 4px 0 rgba(0,0,0,.35);background:var(--panel-2);
  }
  .detail-cover img{width:100%;height:100%;object-fit:cover;}
  .detail-info h1{font-family:var(--font-display);font-size:21px;margin:0 0 6px;line-height:1.2;}
  .detail-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .meta-pill{
    font-family:var(--font-mono);font-size:10px;background:var(--panel);border:1px solid var(--line);
    padding:3px 8px;border-radius:4px;color:var(--gold);
  }
  .synopsis{ max-width:760px;margin:0 auto;padding:0 16px 14px;color:var(--paper-dim);font-size:13.5px;line-height:1.6; }
  .genre-tags{max-width:760px;margin:0 auto;padding:0 16px 20px;display:flex;flex-wrap:wrap;gap:6px;}
  .genre-tags span{
    background:var(--panel-2);border:1px solid var(--line);font-size:11px;padding:4px 10px;border-radius:999px;
    color:var(--paper-dim);
  }
  .chapter-list{max-width:760px;margin:0 auto;padding:0 16px 40px;}
  .chapter-list h2{font-family:var(--font-display);font-size:16px;border-top:1px solid var(--line);padding-top:16px;margin-bottom:10px;}
  .chapter-row{
    display:flex;justify-content:space-between;align-items:center;padding:12px 12px;
    border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px;
  }
  .chapter-row:hover{background:var(--panel);}
  .chapter-row .date{font-family:var(--font-mono);font-size:11px;color:var(--paper-dim);}

  .reader{ position:fixed;inset:0;background:#000;z-index:200;display:none;overflow-y:auto; }
  .reader.open{display:block;}
  .reader-bar{
    position:sticky;top:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:5;
    padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222;
  }
  .reader-bar .ttl{font-size:13px;color:#ccc;font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .reader-pages{max-width:760px;margin:0 auto;padding-bottom:60px;}
  .reader-pages img{width:100%;display:block;}
  .reader-nav{
    position:sticky;bottom:0;background:rgba(0,0,0,0.9);border-top:1px solid #222;padding:12px 16px;
    display:flex;gap:10px;justify-content:center;
  }
  .reader-nav button{
    background:var(--spine);border:none;color:var(--paper);padding:9px 18px;border-radius:8px;
    font-size:13px;cursor:pointer;font-family:var(--font-body);font-weight:600;
  }
  .reader-nav button:disabled{background:var(--panel-2);color:var(--paper-dim);cursor:not-allowed;}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand" onclick="goTab('latest')"><b>Rak</b><span>KOMIK</span></div>
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#b9b3a0" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="Cari judul komik…" onkeydown="if(event.key==='Enter')doSearch()">
    </div>
  </div>
  <nav class="tabs">
    <button data-tab="latest" class="active" onclick="goTab('latest')">📰 Terbaru</button>
    <button data-tab="populer" onclick="goTab('populer')">⭐ Populer</button>
    <button data-tab="top" onclick="goTab('top')">🏆 Top</button>
    <button data-tab="recomen" onclick="goTab('recomen')">💡 Rekomendasi</button>
    <button data-tab="genres" onclick="goTab('genres')">🏷️ Genre</button>
    <button data-tab="manga" onclick="goTab('manga')">Manga</button>
    <button data-tab="manhwa" onclick="goTab('manhwa')">Manhwa</button>
    <button data-tab="manhua" onclick="goTab('manhua')">Manhua</button>
  </nav>
</header>

<main>
  <div id="sectionTitle" class="section-title">Komik Terbaru</div>
  <div id="content"><div class="loading"><span class="spine-loader"></span>Memuat…</div></div>
</main>

<div class="overlay" id="detailOverlay">
  <div class="overlay-bar">
    <button class="back-btn" onclick="closeDetail()">←</button>
    <div class="ttl" id="detailTitleBar">Detail</div>
  </div>
  <div id="detailContent"></div>
</div>

<div class="reader" id="readerOverlay">
  <div class="reader-bar">
    <button class="back-btn" onclick="closeReader()">←</button>
    <div class="ttl" id="readerTitleBar">Chapter</div>
  </div>
  <div class="reader-pages" id="readerPages"></div>
  <div class="reader-nav">
    <button id="prevChBtn" onclick="prevChapter()">‹ Prev</button>
    <button id="nextChBtn" onclick="nextChapter()">Next ›</button>
  </div>
</div>

<script>
/* Base URL API BacaKomik (Sanka Vollerei) */
const API_BASE_URL = "https://www.sankavollerei.web.id";

const EP = {
  list:      () => `/comic/bacakomik/list`,
  search:    (q) => `/comic/bacakomik/search/${encodeURIComponent(q)}`,
  genres:    () => `/comic/bacakomik/genres`,
  byGenre:   (g) => `/comic/bacakomik/genre/${encodeURIComponent(g)}`,
  detail:    (slug) => `/comic/bacakomik/detail/${slug}`,
  chapter:   (slug) => `/comic/bacakomik/chapter/${slug}`,
  recomen:   () => `/comic/bacakomik/recomen`,
  latest:    () => `/comic/bacakomik/latest`,
  populer:   () => `/comic/bacakomik/populer`,
  onlyType:  (t) => `/comic/bacakomik/only/${t}`,
  top:       () => `/comic/bacakomik/top`,
};

let state = { navigation:{next:null,prev:null} };

async function fetchJSON(url){
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), 12000);
  try{
    const res = await fetch(url, {signal: controller.signal});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally {
    clearTimeout(timeout);
  }
}

// Beberapa proxy CORS dicoba berurutan sampai ada yang berhasil
function proxyUrls(fullUrl){
  const enc = encodeURIComponent(fullUrl);
  return [
    fullUrl, // percobaan langsung (kalau suatu saat API sudah mengizinkan CORS)
    'https://api.allorigins.win/raw?url=' + enc,
    'https://corsproxy.io/?url=' + enc,
    'https://thingproxy.freeboard.io/fetch/' + fullUrl,
  ];
}

async function api(path){
  const fullUrl = API_BASE_URL.replace(/\/$/,'') + path;
  const attempts = proxyUrls(fullUrl);
  let lastErr;
  for(const url of attempts){
    try{
      const json = await fetchJSON(url);
      if(json && json.success === false) throw new Error(json.message || 'API mengembalikan error');
      return json;
    }catch(err){
      lastErr = err;
      // coba proxy berikutnya
    }
  }
  throw new Error('Semua percobaan koneksi gagal (kemungkinan diblokir CORS/adblocker). Detail terakhir: ' + (lastErr ? lastErr.message : 'unknown'));
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return String(s).replace(/'/g, "\\'"); }

function comicCardHTML(c){
  const title = c.title || 'Tanpa Judul';
  const img = c.cover || '';
  const type = c.type || '';
  const chapter = c.chapter || '';
  const rating = c.rating || '';
  const slug = c.slug || '';
  const coverInner = img
    ? `<img src="${img}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=ph>${escapeHtml(title)}</div>'">`
    : `<div class="ph">${escapeHtml(title)}</div>`;
  return `
    <div class="card" onclick="openDetail('${escapeAttr(slug)}')">
      <div class="cover">
        ${type ? `<span class="type-tag">${escapeHtml(type)}</span>` : ''}
        ${rating ? `<span class="rating-tag">★ ${escapeHtml(String(rating))}</span>` : ''}
        ${coverInner}
      </div>
      <div class="title">${escapeHtml(title)}</div>
      ${chapter ? `<div class="chapter">${escapeHtml(String(chapter))}</div>` : ''}
    </div>`;
}

function renderGrid(list){
  if(!list || !list.length){ return `<div class="empty">Tidak ada komik ditemukan.</div>`; }
  return `<div class="grid">${list.map(comicCardHTML).join('')}</div>`;
}

async function loadTab(tab){
  const content = document.getElementById('content');
  const titleEl = document.getElementById('sectionTitle');
  content.innerHTML = `<div class="loading"><span class="spine-loader"></span>Memuat…</div>`;
  const titles = {
    latest:'Komik Terbaru', populer:'Komik Populer', top:'Top Komik',
    recomen:'Rekomendasi', genres:'Pilih Genre', manga:'Manga', manhwa:'Manhwa', manhua:'Manhua'
  };
  titleEl.textContent = titles[tab] || 'Komik';

  try{
    if(tab === 'genres'){
      const data = await api(EP.genres());
      const genres = data.genres || [];
      if(!genres.length){ content.innerHTML = `<div class="empty">Genre tidak ditemukan.</div>`; return; }
      content.innerHTML = `<div class="genre-row">${genres.map(g=>
        `<button class="genre-chip" onclick="loadGenre('${escapeAttr(g.slug)}','${escapeAttr(g.title)}')">${escapeHtml(g.title)}</button>`
      ).join('')}</div><div id="genreResults"></div>`;
      return;
    }

    let data;
    if(tab === 'latest') data = await api(EP.latest());
    else if(tab === 'populer') data = await api(EP.populer());
    else if(tab === 'top') data = await api(EP.top());
    else if(tab === 'recomen') data = await api(EP.recomen());
    else if(['manga','manhwa','manhua'].includes(tab)) data = await api(EP.onlyType(tab));
    else data = await api(EP.list());

    content.innerHTML = renderGrid(data.komikList);
  }catch(err){
    content.innerHTML = `<div class="error">Gagal memuat data.<br>${escapeHtml(err.message)}</div>`;
  }
}

async function loadGenre(slug, name){
  const box = document.getElementById('genreResults');
  document.querySelectorAll('.genre-chip').forEach(b=>b.classList.remove('active'));
  if(window.event && window.event.target) window.event.target.classList.add('active');
  box.innerHTML = `<div class="loading"><span class="spine-loader"></span>Memuat "${escapeHtml(name)}"…</div>`;
  try{
    const data = await api(EP.byGenre(slug));
    box.innerHTML = renderGrid(data.komikList);
  }catch(err){
    box.innerHTML = `<div class="error">Gagal memuat genre.<br>${escapeHtml(err.message)}</div>`;
  }
}

function goTab(tab){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  window.scrollTo({top:0,behavior:'smooth'});
  loadTab(tab);
}

async function doSearch(){
  const q = document.getElementById('searchInput').value.trim();
  if(!q) return;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('sectionTitle').textContent = `Hasil pencarian: "${q}"`;
  const content = document.getElementById('content');
  content.innerHTML = `<div class="loading"><span class="spine-loader"></span>Mencari…</div>`;
  try{
    const data = await api(EP.search(q));
    content.innerHTML = renderGrid(data.komikList);
  }catch(err){
    content.innerHTML = `<div class="error">Gagal mencari.<br>${escapeHtml(err.message)}</div>`;
  }
}

/* ---------- detail ---------- */
async function openDetail(slug){
  if(!slug) return;
  const overlay = document.getElementById('detailOverlay');
  const body = document.getElementById('detailContent');
  overlay.classList.add('open');
  document.getElementById('detailTitleBar').textContent = 'Memuat…';
  body.innerHTML = `<div class="loading"><span class="spine-loader"></span>Memuat detail…</div>`;
  window.scrollTo(0,0);
  try{
    const data = await api(EP.detail(slug));
    const c = data.detail || {};
    const title = c.title || 'Tanpa Judul';
    const img = c.cover || '';
    const chapters = Array.isArray(c.chapters) ? c.chapters : [];
    const genres = Array.isArray(c.genres) ? c.genres : [];

    document.getElementById('detailTitleBar').textContent = title;
    body.innerHTML = `
      <div class="detail-hero">
        <div class="detail-cover">${img ? `<img src="${img}">` : `<div class="ph" style="display:flex;align-items:center;justify-content:center;height:100%;font-family:var(--font-display);font-size:12px;padding:8px;text-align:center;">${escapeHtml(title)}</div>`}</div>
        <div class="detail-info">
          <h1>${escapeHtml(title)}</h1>
          <div class="detail-meta">
            ${c.type ? `<span class="meta-pill">${escapeHtml(c.type)}</span>` : ''}
            ${c.status ? `<span class="meta-pill">${escapeHtml(c.status)}</span>` : ''}
            ${c.rating ? `<span class="meta-pill">★ ${escapeHtml(String(c.rating))}</span>` : ''}
            ${c.author ? `<span class="meta-pill">✍️ ${escapeHtml(c.author)}</span>` : ''}
            ${c.release ? `<span class="meta-pill">${escapeHtml(c.release)}</span>` : ''}
          </div>
        </div>
      </div>
      <div class="synopsis">${escapeHtml(c.synopsis || 'Sinopsis tidak tersedia.')}</div>
      ${genres.length ? `<div class="genre-tags">${genres.map(g=>`<span>${escapeHtml(g.title || g)}</span>`).join('')}</div>` : ''}
      <div class="chapter-list">
        <h2>Daftar Chapter (${chapters.length})</h2>
        ${chapters.length ? chapters.map((ch,i)=>{
          const chTitle = ch.title && ch.title.trim() ? ch.title : ch.slug.replace(/-/g,' ');
          return `<div class="chapter-row" onclick="openReader('${escapeAttr(ch.slug)}')">
                    <span>${escapeHtml(chTitle)}</span>
                    <span class="date">${escapeHtml(ch.date || '')}</span>
                  </div>`;
        }).join('') : '<div class="empty">Belum ada chapter.</div>'}
      </div>
    `;
  }catch(err){
    body.innerHTML = `<div class="error">Gagal memuat detail.<br>${escapeHtml(err.message)}</div>`;
  }
}
function closeDetail(){ document.getElementById('detailOverlay').classList.remove('open'); }

/* ---------- reader ---------- */
async function openReader(slug){
  if(!slug) return;
  const overlay = document.getElementById('readerOverlay');
  const pages = document.getElementById('readerPages');
  overlay.classList.add('open');
  pages.innerHTML = `<div class="loading"><span class="spine-loader"></span>Memuat halaman…</div>`;
  window.scrollTo(0,0);
  try{
    const data = await api(EP.chapter(slug));
    const images = Array.isArray(data.images) ? data.images : [];
    state.navigation = data.navigation || {next:null, prev:null};
    document.getElementById('readerTitleBar').textContent = data.title || 'Chapter';
    pages.innerHTML = images.length
      ? images.map(src => `<img src="${src}" loading="lazy">`).join('')
      : `<div class="empty" style="color:#999;">Halaman tidak ditemukan.</div>`;
    document.getElementById('prevChBtn').disabled = !state.navigation.prev;
    document.getElementById('nextChBtn').disabled = !state.navigation.next;
  }catch(err){
    pages.innerHTML = `<div class="error">Gagal memuat chapter.<br>${escapeHtml(err.message)}</div>`;
  }
}
function closeReader(){ document.getElementById('readerOverlay').classList.remove('open'); }
function prevChapter(){ if(state.navigation.prev) openReader(state.navigation.prev); }
function nextChapter(){ if(state.navigation.next) openReader(state.navigation.next); }

/* ---------- init ---------- */
loadTab('latest');
</script>
</body>
</html>
