<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Proxy — Cyronime</title>
  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --color-primary: #D6A755;
      --color-accent: #5C8AA6;
      --color-bg: #0B0C10;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--color-bg);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #14161c;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: var(--color-primary);
      white-space: nowrap;
      text-decoration: none;
      font-size: 15px;
    }
    .brand i { color: var(--color-accent); }
    #urlInput {
      flex: 1;
      min-width: 120px;
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      outline: none;
      font-size: 14px;
      background: #0B0C10;
      color: #fff;
    }
    #urlInput:focus { border-color: var(--color-primary); }
    select {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #0B0C10;
      color: #fff;
      font-size: 13px;
      max-width: 150px;
    }
    button {
      padding: 9px 18px;
      border: none;
      border-radius: 20px;
      background: var(--color-primary);
      color: #14161c;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }
    button:hover { filter: brightness(1.1); }
    button.secondary {
      background: transparent;
      color: var(--color-accent);
      border: 1px solid var(--color-accent);
    }
    #status {
      padding: 4px 16px;
      font-size: 12px;
      color: #8a8f9c;
      background: var(--color-bg);
      min-height: 20px;
    }
    #frame {
      width: 100%;
      height: calc(100vh - 78px);
      border: none;
      background: #fff;
    }
    @media (max-width: 640px) {
      .toolbar { flex-wrap: wrap; }
      select { display: none; }
    }
  </style>
</head>
<body>

  <header class="toolbar">
    <a href="/" class="brand"><i class="fa-solid fa-shield-halved"></i> Cyronime Proxy</a>

    <input id="urlInput" type="text" placeholder="Masukkan URL, contoh: google.com" value="https://www.google.com">

    <select id="uaSelect" title="Pilih User-Agent">
      <option value="">UA: Chrome Desktop</option>
      <option value="Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1">UA: iPhone Safari</option>
      <option value="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Mobile Safari/537.36">UA: Android Chrome</option>
      <option value="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:126.0) Gecko/20100101 Firefox/126.0">UA: Firefox Desktop</option>
      <option value="Googlebot/2.1 (+http://www.google.com/bot.html)">UA: Googlebot</option>
    </select>

    <button id="goBtn">Buka</button>
    <button id="googleBtn" class="secondary">Google</button>
  </header>

  <div id="status">Siap.</div>

  <iframe id="frame" title="proxy-frame"></iframe>

  <script>
    const urlInput = document.getElementById('urlInput');
    const uaSelect = document.getElementById('uaSelect');
    const goBtn = document.getElementById('goBtn');
    const googleBtn = document.getElementById('googleBtn');
    const frame = document.getElementById('frame');
    const statusBar = document.getElementById('status');

    function normalizeUrl(raw) {
      let url = raw.trim();
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      return url;
    }

    function loadUrl(rawUrl) {
      const url = normalizeUrl(rawUrl);
      const ua = uaSelect.value;
      let proxyPath = '/api/webproxy?url=' + encodeURIComponent(url);
      if (ua) proxyPath += '&ua=' + encodeURIComponent(ua);

      statusBar.textContent = 'Memuat: ' + url + ' ...';
      frame.src = proxyPath;
      urlInput.value = url;
    }

    goBtn.addEventListener('click', () => loadUrl(urlInput.value));
    googleBtn.addEventListener('click', () => {
      urlInput.value = 'https://www.google.com';
      loadUrl('https://www.google.com');
    });
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadUrl(urlInput.value);
    });
    frame.addEventListener('load', () => { statusBar.textContent = 'Selesai memuat.'; });

    window.addEventListener('DOMContentLoaded', () => loadUrl(urlInput.value));
  </script>
</body>
</html>
