<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance — Cyronime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <link rel="stylesheet" href="/assets/css/app.css">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0F1015; color: #fff; }
        .nb-shadow { box-shadow: 4px 4px 0px 0px #000; }
        .animate-pulse-slow { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="bg-slate-800/50 border-2 border-black rounded-2xl p-10 nb-shadow max-w-md text-center">
        <div class="animate-float mb-6">
            <i class="fas fa-screwdriver-wrench text-5xl text-amber-400"></i>
        </div>
        <h1 class="text-2xl font-extrabold mb-3" style="font-family: 'Space Grotesk', sans-serif;">
            Sedang Maintenance
        </h1>
        <p id="maintenance-message" class="text-sm text-slate-400 leading-relaxed mb-6">
            Website sedang dalam pemeliharaan. Silakan kembali lagi beberapa saat lagi.
        </p>
        <div class="flex items-center justify-center gap-2 text-xs text-slate-500">
            <span class="w-2 h-2 bg-amber-400 rounded-full animate-pulse-slow"></span>
            <span>Cyronime.my.id</span>
        </div>
    </div>

    <script>
        // Ambil pesan dari URL param (?msg=...) yang dikirim middleware
        const params = new URLSearchParams(window.location.search);
        const msg = params.get('msg');
        if (msg) {
            document.getElementById('maintenance-message').textContent = decodeURIComponent(msg);
        }

        // Auto-check setiap 30 detik kalau maintenance sudah selesai
        async function checkMaintenance() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                if (data.warning && !data.warning.maintenance) {
                    window.location.href = '/';
                }
            } catch {}
        }
        setInterval(checkMaintenance, 30000);
    </script>
</body>
</html>
